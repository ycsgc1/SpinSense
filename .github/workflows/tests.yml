name: Tests

# Runs the unit suites and static analysis on every push and PR: Python in
# `test`, the browser scripts in `lint-js`.
#
# The two process suites must run from inside their own directory: backend_main
# mounts StaticFiles("static") and Jinja2Templates("templates") by relative
# path, so pytest launched from the repo root can't find them. The shared
# `spinsense` package has no such constraint and runs from the root.

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches docker/Dockerfile's base image
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install system audio libraries
        # sounddevice loads PortAudio at import time; core_engine and
        # backend_main both import it at module scope.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install dependencies
        # The same constraints the image is built with, so what is tested is
        # what ships — down to the packages nothing here names directly.
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Shared domain tests
        run: python -m pytest -q spinsense

      - name: Core engine tests
        working-directory: core
        run: python -m pytest -q

      - name: GUI + backend tests
        working-directory: gui
        run: python -m pytest -q

      - name: Lint (unused imports, undefined names, correctness)
        run: ruff check --select E4,E7,E9,F core/ gui/ spinsense/

      - name: Dead code
        run: vulture core/ gui/ spinsense/ --min-confidence 100

  lint-js:
    # The scripts under gui/static are served as written — nothing compiles
    # them and no test loads them, so this is the only thing that reads them
    # before a browser does. Rules and rationale are in eslint.config.mjs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Lint the browser scripts (undefined names, unused code, correctness)
        # No package.json and no install step: the config imports nothing, so
        # the linter itself is all that is fetched. Pinned, like ruff.
        run: npx --yes eslint@10.12.0 gui/static
